  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <meta name="theme-color" content="#ff0000">
    <title>AndroidX WebView Test Case</title>
    <style>
      body {
        padding: max(1em, env(safe-area-inset-top, 0px))
                 max(1em, env(safe-area-inset-right, 0px))
                 max(1em, env(safe-area-inset-bottom, 0px))
                 max(1em, env(safe-area-inset-left, 0px));
      }

      div {
        margin: 1em 0;
      }
    </style>
  </head>
  <body>
    <span>This page supports customizing the <code>theme-color</code> attribute.</span>

    <div>
      <label for="picker">Theme Color:</label>
      <input id="picker" type="color" value="#ff0000">
    </div>

    <script>
      document.getElementById("picker").addEventListener("change", (e) => {
        document.querySelector(`meta[name="theme-color"]`).setAttribute("content", e.target.value);
      });
    </script>
  </body>
</html>
